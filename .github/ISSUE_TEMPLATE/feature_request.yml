name: 功能建议 / Feature Request
description: 建议新功能或改进 / Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        描述越具体越容易被采纳。如果和 H3 视频生成工作流相关，欢迎附上你的使用场景。
        The more concrete, the better. Workflow-related use cases are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false
